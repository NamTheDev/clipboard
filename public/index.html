<!doctype html>
<html lang="en" data-theme="dark" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e1e2e">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="A minimal Catppuccin shared clipboard. Create a vault, paste snippets, and share a room ID.">
  <title>clipboard</title>
  <link rel="canonical" href="https://namthedev.github.io/clipboard/">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <script src="./theme-signal.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./bootstrap.min.css">
  <link rel="stylesheet" href="./config.css">
  <link rel="stylesheet" href="./shell.css?v=cleanup2">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./clipboard.css">
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="desktop d-flex justify-content-center bg-body" id="desktop">
    <main id="app-window" class="window main-window w-100 d-flex flex-column h-100 min-h-0 position-relative" aria-label="clipboard application">
      <header class="site-header border-bottom mx-4 lg:mx-6"><div class="header-inner d-flex align-items-center gap-4 w-100"><span class="brand-name">namchill235 / clipboard</span><span class="header-description flex-grow-1 min-w-0 fg-2 fs-sm">A clipboard GitHub web app for copy and paste.</span></div></header>
        <div id="app-navigation" class="app-navigation border-bottom d-flex flex-wrap align-items-center gap-2">
          <nav class="nav d-flex flex-wrap gap-2" aria-label="Vault navigation">
            <button type="button" class="nav-btn active nav-link rounded-5 justify-content-start text-start" data-action="home" id="sidebar-home"><span class="ui-icon material-symbols-rounded align-middle flex-shrink-0" aria-hidden="true">folder_open</span> Vaults</button>
            <button type="button" class="nav-btn btn btn-solid theme-primary rounded-5" data-action="new"><span class="ui-icon material-symbols-rounded align-middle flex-shrink-0" aria-hidden="true">add</span> Create vault</button>
            <button type="button" class="nav-btn nav-link rounded-5 justify-content-start text-start" data-action="join"><span class="ui-icon material-symbols-rounded align-middle flex-shrink-0" aria-hidden="true">login</span> Join vault</button>
          </nav>
          <nav class="nav d-flex flex-wrap gap-2" aria-label="Current vault">
            <button type="button" class="nav-btn nav-link rounded-5 justify-content-start text-start" id="sidebar-active" hidden><span class="ui-icon material-symbols-rounded align-middle flex-shrink-0" aria-hidden="true">folder</span><span id="sidebar-room"></span></button>
          </nav>
          <div class="vault-actions d-flex flex-wrap align-items-center gap-2" id="sidebar-room-actions" hidden>
            <nav class="nav d-flex flex-wrap gap-2" aria-label="Vault actions">
              <button type="button" class="nav-btn btn btn-solid theme-primary rounded-5" id="add-item" data-action="add"><span class="ui-icon material-symbols-rounded align-middle flex-shrink-0" aria-hidden="true">add</span> New item</button>
              <button type="button" class="nav-btn nav-link rounded-5 justify-content-start text-start" id="paste-item" data-action="paste"><span class="ui-icon material-symbols-rounded align-middle flex-shrink-0" aria-hidden="true">content_paste</span> Paste text</button>
              <button type="button" class="nav-btn nav-link rounded-5 justify-content-start text-start" id="copy-code"><span class="ui-icon material-symbols-rounded align-middle flex-shrink-0" aria-hidden="true">tag</span> Copy ID</button>
              <button type="button" class="nav-btn nav-link rounded-5 justify-content-start text-start" id="copy-link"><span class="ui-icon material-symbols-rounded align-middle flex-shrink-0" aria-hidden="true">link</span> Copy link</button>
              <button type="button" class="nav-btn nav-link rounded-5 justify-content-start text-start" id="room-refresh" data-action="refresh"><span class="ui-icon material-symbols-rounded align-middle flex-shrink-0" aria-hidden="true">refresh</span> Refresh</button>
              <button type="button" class="nav-btn nav-link rounded-5 justify-content-start text-start" data-action="leave"><span class="ui-icon material-symbols-rounded align-middle flex-shrink-0" aria-hidden="true">logout</span> Leave vault</button>
              <button type="button" class="nav-btn nav-link rounded-5 justify-content-start text-start" id="delete-room" data-action="delete-room" hidden><span class="ui-icon material-symbols-rounded align-middle flex-shrink-0" aria-hidden="true">delete</span> Delete vault</button>
            </nav>
            <div class="fg-3 fs-xs" id="room-expiry"></div>
          </div>
          <nav class="nav d-flex flex-wrap gap-2" aria-label="Settings and information">
            <button type="button" class="nav-btn nav-link rounded-5 justify-content-start text-start" data-action="settings"><span class="ui-icon material-symbols-rounded align-middle flex-shrink-0" aria-hidden="true">settings</span> Settings</button>
            <button type="button" class="nav-btn nav-link rounded-5 justify-content-start text-start" data-action="privacy"><span class="ui-icon material-symbols-rounded align-middle flex-shrink-0" aria-hidden="true">policy</span> Privacy &amp; sharing</button>
            <button type="button" class="nav-btn nav-link rounded-5 justify-content-start text-start" data-action="about"><span class="ui-icon material-symbols-rounded align-middle flex-shrink-0" aria-hidden="true">info</span> About</button>
          </nav>
        </div>
      <div class="workspace app-content d-flex flex-grow-1 position-relative min-h-0 min-w-0">
        <section class="content-pane d-flex flex-column flex-grow-1 overflow-hidden min-h-0 min-w-0 position-relative" id="content" aria-label="Vault contents">
          <div class="home-screen flex-grow-1 min-h-0 overflow-auto" id="home-screen">
            <div class="content-heading d-flex align-items-center justify-content-between"><h1 class="page-title fw-medium m-0">Vaults</h1></div>
            <div class="home-body">
              <div class="home-choices note-grid d-grid">
                <section class="groupbox note-window card rounded-6 min-w-0 overflow-hidden">
                  <div class="note-paper card-body min-w-0 pt-3"><h2 class="note-heading card-title fw-medium mb-1">Create a vault</h2><p class="note-text mb-0">Share temporary snippets.</p></div>
                  <div class="note-foot d-flex flex-wrap align-items-center gap-1"><button class="chrome-btn primary btn-solid theme-primary btn rounded-5" type="button" data-action="new">Create vault</button></div>
                </section>
                <section class="groupbox note-window card rounded-6 min-w-0 overflow-hidden">
                  <form id="join-form">
                    <div class="note-paper card-body min-w-0 pt-3"><h2 class="note-heading card-title fw-medium mb-1">Join a vault</h2><label class="field-label form-label" for="join-code">Room ID</label><input class="win-input code-input form-control rounded-5 font-monospace fw-medium" id="join-code" maxlength="7" autocomplete="off" spellcheck="false" placeholder="ABC-234" required></div>
                    <div class="note-foot d-flex flex-wrap align-items-center gap-1"><button type="submit" class="chrome-btn primary btn-solid theme-primary btn rounded-5">Join</button></div>
                  </form>
                </section>
              </div>
              <p class="dialog-note form-text" id="deployment-notice" hidden></p>
            </div>
          </div>
          <div class="room-screen d-flex flex-column min-h-0 h-100" id="room-screen" hidden>
            <div class="room-bar content-heading d-flex align-items-center justify-content-between">
              <div><h1 class="page-title fw-medium m-0" id="room-title"></h1><p class="page-desc fg-2 mb-0" id="room-caption"></p></div>
              <span class="room-badge address-badge badge rounded-5" id="access-badge">READ ONLY</span>
            </div>
            <div class="room-details quick-bar card d-flex flex-row align-items-center rounded-6"><strong class="room-code font-monospace fw-medium user-select-all text-break" id="room-code" aria-label="Room ID"></strong></div>
            <div class="file-surface d-grid flex-grow-1 min-h-0">
              <div class="file-list-pane board-scroll flex-grow-1 overflow-auto rounded-6 min-h-0 min-w-0">
                <div class="board-label fg-2 text-uppercase fw-medium">Clipboard items</div>
                <div class="file-list note-grid d-grid align-items-start" id="file-list" role="listbox" aria-label="Clipboard items" tabindex="0"></div>
              </div>
              <div class="preview-pane rounded-0 min-w-0 min-h-0 overflow-auto">
                <div class="board-label fg-2 text-uppercase fw-medium">Item preview</div>
                <div class="preview-card note-window card rounded-6 min-w-0 overflow-hidden d-flex flex-column">
                  <div class="note-titlebar d-flex align-items-center gap-3 fg-2 pb-0"><span class="ui-icon material-symbols-rounded align-middle flex-shrink-0" aria-hidden="true">description</span><span class="note-titlebar-text flex-grow-1 text-truncate min-w-0 fs-xs" id="preview-meta">Select an item</span></div>
                  <pre id="preview-content" class="note-paper preview-content card-body rounded-6 min-w-0 pt-3 overflow-auto m-0">No item selected.</pre>
                  <div class="note-foot preview-actions d-flex flex-wrap align-items-center gap-3">
                    <button type="button" class="chrome-btn primary btn-solid theme-primary btn rounded-5" id="copy-selected">Copy text</button>
                    <button type="button" class="chrome-btn btn-outline theme-secondary btn rounded-5" id="edit-selected" hidden>Edit</button>
                    <button type="button" class="chrome-btn btn-outline theme-secondary btn rounded-5" id="delete-selected" hidden>Delete</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
      <footer class="status-bar d-flex align-items-center gap-4 border-top fg-2 bg-1 fs-xs">
        <span class="status-cell flex-grow-1" id="status-text" role="status">Ready</span>
        <span class="status-cell" id="status-count">0 item(s)</span>
        <span class="status-cell" id="status-mode">Vaults</span>
      </footer>
    </main>
    <div id="modal-backdrop" class="dialog-backdrop modal-backdrop d-flex align-items-center justify-content-center" hidden>
      <dialog open class="dialog show window dialog-window rounded-7" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <header class="title-bar dialog-heading dialog-header d-flex align-items-center gap-3 py-3"><span class="app-icon"><img class="ui-icon align-middle flex-shrink-0" src="./favicon.svg" alt=""></span><span class="title-text dialog-title fw-medium fs-lg" id="dialog-title">Dialog</span></header>
        <div class="dialog-body modal-body min-h-0 py-4" id="dialog-body"></div>
        <div class="dialog-footer modal-actions d-flex flex-wrap justify-content-end align-items-center gap-3 py-3" id="dialog-actions"></div>
      </dialog>
    </div>
  </div>
</body>
</html>
