name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clipboard-github-pages
  cancel-in-progress: false
jobs:
  build:
    name: Prepare static GitHub Pages artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lucide icon assets
        run: |
          npm install --no-audit --no-fund
          npm run icons
      - name: Validate static source
        run: |
          test -s public/index.html
          test -s public/app.js
          test -s public/style.css
          test -s public/favicon.svg
          test -s public/icons/settings.svg
          test -s public/icons/clipboard.svg
      - name: Configure public API URL
        env:
          CLIPBOARD_API_BASE: ${{ vars.CLIPBOARD_API_BASE }}
        run: |
          node --input-type=module -e '
            import {writeFileSync} from "node:fs";
            const base = (process.env.CLIPBOARD_API_BASE || "https://clipboard-production-afe5e7e4.up.railway.app").replace(/\/+$/, "");
            if (base && !/^https:\/\/[^\s]+$/.test(base)) throw new Error("CLIPBOARD_API_BASE must be an HTTPS URL");
            writeFileSync("public/config.js", `window.CLIPBOARD_API_BASE = ${JSON.stringify(base)};\n`);
          '
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: Publish and verify GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test public Pages and shared-room API
        env:
          CLIPBOARD_API_BASE: ${{ vars.CLIPBOARD_API_BASE }}
        run: node scripts/smoke-deployment.mjs
