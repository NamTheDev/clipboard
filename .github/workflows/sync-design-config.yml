name: Sync shared design configuration
on:
  workflow_dispatch:
  schedule:
    - cron: '34 3 * * *'
permissions:
  contents: write
concurrency:
  group: shared-design-config-sync
  cancel-in-progress: false
jobs:
  sync:
    name: Update vendored design system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch canonical CSS from util
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git ls-remote https://github.com/NamTheDev/util.git refs/heads/main | cut -f1)
          test -n "$revision"
          for asset in config.css shell.css marquee.js; do
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/NamTheDev/util/$revision/design/$asset" -o "/tmp/$asset"
            test -s "/tmp/$asset"
          done
          cp /tmp/config.css /tmp/shell.css /tmp/marquee.js public/
      - name: Commit only changed stylesheet
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/config.css public/shell.css public/marquee.js; then
            echo 'Already synchronized with util.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/config.css public/shell.css public/marquee.js
          git commit -m "Sync: Update shared design configuration

          $(date -u +%d-%m-%Y)

          - Mirror util/design/config.css into clipboard."
          git push
