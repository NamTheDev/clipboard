name: Sync shared design configuration
on:
  workflow_dispatch:
  schedule:
    - cron: '34 3 * * *'
permissions:
  contents: write
concurrency:
  group: shared-design-config-sync
  cancel-in-progress: false
jobs:
  sync:
    name: Update vendored design system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch canonical CSS from util
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/NamTheDev/util/main/design/config.css \
            -o /tmp/config.css
          test -s /tmp/config.css
          cp /tmp/config.css public/config.css
      - name: Commit only changed stylesheet
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/config.css; then
            echo 'Already synchronized with util.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/config.css
          git commit -m "Sync: Update shared design configuration

          $(date -u +%d-%m-%Y)

          - Mirror util/design/config.css into clipboard."
          git push
