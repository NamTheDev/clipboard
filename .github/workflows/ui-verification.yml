name: Clipboard UI Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: Verify classic and dark UI plus room sharing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install Lucide static icons
        run: |
          npm install --no-audit --no-fund
          npm run icons
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run local clipboard server and Chromium tests
        shell: bash
        run: |
          set -euo pipefail
          export DATA_DIR="$(mktemp -d)"
          export HOST=127.0.0.1 PORT=34567
          npm start >/tmp/clipboard-ui-server.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; rm -rf "$DATA_DIR"' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:34567/api/health >/dev/null; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then cat /tmp/clipboard-ui-server.log; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:34567/api/health
          python tests/ui_browser.py
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: clipboard-browser-evidence
          path: test-results/
          if-no-files-found: ignore
